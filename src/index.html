<!DOCTYPE html>
<html dir="ltr" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>BitPay QR Code</title>
    <script type="module" src="/build/bp-qr-code.esm.js"></script>
  </head>
  <body style="background-color: #ddd">
    <bp-qr-code
      id="qr1"
      contents="bitcoincash:?r=https://bitpay.com/i/exampleh3mCKGUna7v9S1z"
      module-color="#346E59"
      position-ring-color="#385A4E"
      position-center-color="#70C559"
      mask-x-to-y-ratio="1.2"
      style="width: 60vw; height: 60vw; background-color: #fff"
    >
      <img src="assets/bch-bill.svg" slot="icon" alt="Bitcoin Cash" />
    </bp-qr-code>

    <bp-qr-code
      contents="bitcoin:?r=https://bitpay.com/i/exampleh3mCKGUna7v9S1z"
      module-color="#CB5F12"
      position-ring-color="#593F33"
      position-center-color="#F7931A"
      style="width: 200px"
    >
      <img src="assets/btc.svg" slot="icon" alt="Bitcoin" />
    </bp-qr-code>

    <bp-qr-code
      contents="https://bitpay.com/"
      protocol="BCH"
      legacy="true"
      style="width: 150px; height: 150px; background-color: #fff"
    ></bp-qr-code>
  </body>
</html>
